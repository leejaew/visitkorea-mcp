[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visitkorea-mcp"
version = "1.0.0"
description = "Production MCP server for the Korea Tourism Organization API"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.27.0",
  "httpx==0.28.1",
  "uvicorn==0.44.0",
  "starlette==1.0.0",
]

[project.scripts]
visitkorea-mcp = "mcp_server.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
