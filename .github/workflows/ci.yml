name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visitkorea-mcp/pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e visitkorea-mcp

      - name: Run Python tests
        working-directory: visitkorea-mcp
        run: python -m unittest discover -s tests -v

      - name: Validate package imports and build
        working-directory: visitkorea-mcp
        run: |
          python -c "import mcp_server; from mcp_server.server import create_server"
          python -m compileall -q src
          python -m pip wheel --no-deps --no-build-isolation -w /tmp/visitkorea-dist .

      - name: Type-check workspace
        run: pnpm run typecheck