name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visitkorea-mcp/pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e visitkorea-mcp

      - name: Run Python tests
        working-directory: visitkorea-mcp
        run: python -m unittest discover -s tests -v

      - name: Validate package imports and build
        working-directory: visitkorea-mcp
        run: |
          python -c "import mcp_server; from mcp_server.server import create_server"
          python -m compileall -q src
          python -m pip wheel --no-deps --no-build-isolation -w /tmp/visitkorea-dist .

      - name: Validate deployment dependency bundle
        run: |
          rm -rf /tmp/visitkorea-python-deps
          mkdir -p /tmp/visitkorea-python-deps
          tar -xzf visitkorea-mcp/deployment/python-deps.tar.gz \
            -C /tmp/visitkorea-python-deps
          PYTHONNOUSERSITE=1 \
            PYTHONPATH=/tmp/visitkorea-python-deps \
            python -c "import httpx, mcp, starlette, uvicorn"
